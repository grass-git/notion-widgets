<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Lecture Note</title>
<!--
  Redirect shim: Notion's API drops non-http(s) link hrefs, so the Library
  links here and this page hands off to the obsidian:// URI.

  Creates 01 Inbox/Lecture <today>.md in vault "Engineering" (Obsidian
  auto-increments the name on collision). Body = the vault's
  99 Backend/Templates/Lecture Note.md with {{date}} filled at click time,
  so date: is always the day the note was created. KEEP IN SYNC: if that
  template changes, update TEMPLATE below and push.
-->
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font: 15px/1.5 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #fff; color: #37352f;
  }
  @media (prefers-color-scheme: dark) { body { background: #191919; color: #d4d4d4; } }
  .card { text-align: center; padding: 32px; max-width: 360px; }
  .icon { font-size: 40px; margin-bottom: 12px; }
  a.btn {
    display: inline-block; margin-top: 16px; padding: 10px 18px; border-radius: 6px;
    background: #2383e2; color: #fff; text-decoration: none; font-weight: 600;
  }
  .hint { margin-top: 20px; font-size: 13px; opacity: .6; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">📝</div>
    <div>Opening a new lecture note in Obsidian…</div>
    <a class="btn" id="go" href="#">Open Obsidian</a>
    <div class="hint">If nothing happened, click the button. You can close this tab afterwards.</div>
  </div>
<script>
  // Verbatim mirror of 99 Backend/Templates/Lecture Note.md. No title heading
  // by design: the note opens on blank space under the frontmatter (the notes
  // section) and a --- divider closes it off above Key ideas to distill.
  var TEMPLATE = [
    "---",
    "type: lecture",
    'course: ""',
    "date: {{date}}",
    "distilled: false",
    "---",
    "",
    "",
    "---",
    "## Key ideas to distill",
    "-",
    "",
    "## Questions / didn't understand",
    "-",
    "",
    "## Resources",
    "",
    ""
  ].join("\n");

  // Date the note is created = the moment this page is opened.
  var d = new Date();
  var pad = function (n) { return (n < 10 ? "0" : "") + n; };
  var today = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());

  var content = TEMPLATE.replace(/\{\{date\}\}/g, today);
  var uri = "obsidian://new?vault=Engineering"
          + "&file=" + encodeURIComponent("01 Inbox/Lecture " + today)
          + "&content=" + encodeURIComponent(content);

  document.getElementById("go").href = uri;
  location.href = uri;
</script>
</body>
</html>
