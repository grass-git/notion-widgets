<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capture in Obsidian</title>
<!--
  Library poster widget: the whole card is one link. Embedded in Notion as an
  <embed>; clicking opens new-lecture.html in the external browser, which
  hands off to obsidian://. The picture is capture-in-obsidian.png in this
  repo (Chris-supplied). If the image is missing, the text fallback shows.
-->
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; background: transparent; }
  a.poster {
    display: block; position: relative; width: 100%; height: 100%;
    min-height: 240px; overflow: hidden; border-radius: 6px;
    text-decoration: none; cursor: pointer;
    background: #f7f6f3; color: #37352f;
  }
  @media (prefers-color-scheme: dark) { a.poster { background: #202020; color: #d4d4d4; } }
  a.poster img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; display: block;
  }
  .fallback {
    position: absolute; inset: 0; display: none; place-items: center; text-align: center;
    font: 600 18px/1.3 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  a.poster.noimg img { display: none; }
  a.poster.noimg .fallback { display: grid; }
</style>
</head>
<body>
  <a class="poster" id="poster" href="new-lecture.html" target="_blank" rel="noopener"
     title="Capture in Obsidian — new lecture note in 01 Inbox">
    <img src="capture-in-obsidian.jpg" alt="Capture in Obsidian"
         onerror="document.getElementById('poster').classList.add('noimg')">
    <div class="fallback"><div>📝<br>Capture in Obsidian</div></div>
  </a>
<script>
  // GitHub Pages serves max-age=600; a unique query per click guarantees the
  // browser fetches the current shim instead of replaying a cached one.
  document.getElementById("poster").addEventListener("click", function () {
    this.href = "new-lecture.html?t=" + Date.now();
  });
</script>
</body>
</html>
